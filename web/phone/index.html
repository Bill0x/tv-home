<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0f1a">
  <title>Draw on the TV</title>
  <style>
    :root { --bg: #0b0f1a; --board: #141a2a; --panel: #1b2236; --text: #f3f5fa; --muted: #8f9bb8; --accent: #f0a35e; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
    body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; flex-wrap: wrap; }
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .swatch { width: 32px; height: 32px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); padding: 0; }
    .swatch.selected { border-color: var(--text); transform: scale(1.12); }
    .sizes { display: flex; gap: 6px; }
    button.size, button.clear { border: 0; border-radius: 10px; background: var(--panel); color: var(--text); font: inherit; height: 36px; min-width: 36px; padding: 0 12px; }
    button.size.selected { background: var(--accent); color: #1b1206; font-weight: 600; }
    button.clear { margin-left: auto; }
    .wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 12px 12px; }
    .board { position: relative; background: var(--board); border-radius: 14px; overflow: hidden; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .status { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 13px; color: var(--muted); background: rgba(0,0,0,.5); padding: 4px 10px; border-radius: 10px; pointer-events: none; }
    .tip { text-align: center; font-size: 13px; color: var(--muted); padding: 0 12px 10px; }
    @media (orientation: landscape) { .tip { display: none; } }
  </style>
</head>
<body>
  <div class="bar">
    <div class="swatches" id="swatches"></div>
    <div class="sizes">
      <button class="size" data-size="0.003">S</button>
      <button class="size selected" data-size="0.006">M</button>
      <button class="size" data-size="0.014">L</button>
    </div>
    <button class="clear" id="clear">Clear</button>
  </div>
  <div class="wrap" id="wrap">
    <div class="board" id="box">
      <canvas id="board"></canvas>
      <div class="status" id="status" hidden>Connecting…</div>
    </div>
  </div>
  <div class="tip">Turn your phone sideways for a bigger board.</div>

  <script src="../shared/board.js"></script>
  <script>
    var board;
    function fit() {
      var wrap = document.getElementById("wrap"), box = document.getElementById("box");
      var cs = getComputedStyle(wrap);
      var W = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      var H = wrap.clientHeight - parseFloat(cs.paddingBottom);
      var w = Math.min(W, H * 16 / 9);
      box.style.width = w + "px";
      box.style.height = w * 9 / 16 + "px";
      if (board) board.resize();
    }
    fit();
    board = new Board(document.getElementById("board"), "");
    board.attachPointer();
    var status = document.getElementById("status");
    board.onstatus = function (ok) {
      status.hidden = ok;
      status.textContent = "Reconnecting to the TV board…";
    };
    board.connect();
    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", function () { setTimeout(fit, 200); });

    var sw = document.getElementById("swatches");
    Board.COLORS.forEach(function (color, i) {
      var b = document.createElement("button");
      b.className = "swatch" + (i === 0 ? " selected" : "");
      b.style.background = color;
      b.onclick = function () {
        board.color = color;
        [].forEach.call(sw.children, function (k) { k.classList.toggle("selected", k === b); });
      };
      sw.appendChild(b);
    });
    document.querySelectorAll(".size").forEach(function (b) {
      b.onclick = function () {
        board.width = parseFloat(b.dataset.size);
        document.querySelectorAll(".size").forEach(function (k) { k.classList.toggle("selected", k === b); });
      };
    });
    document.getElementById("clear").onclick = function () {
      if (confirm("Clear the board for everyone?")) board.clear();
    };
  </script>
</body>
</html>
